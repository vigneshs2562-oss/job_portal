{% extends "base.html" %}{% block title %}Register{% endblock %}{% block content %}
<div class="form-card"><h1>Create account</h1><p class="muted">Verify your email with a 6-digit OTP.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Full Name<input name="full_name" required></label><label>Email<input type="email" name="email" required></label>
<label>Phone<input name="phone" required></label><label>Password<input type="password" name="password" minlength="8" required></label>
<label>Confirm Password<input type="password" name="confirm_password" minlength="8" required></label>
<label>User Type<select name="role"><option value="job_seeker">Job Seeker</option><option value="employer">Employer</option></select></label>
<button class="btn">Send OTP</button></form></div>{% endblock %}
